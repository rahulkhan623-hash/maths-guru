<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My Maths Guru – 1 to 100 Tables</title>
<style>

.btn{border:0;border-radius:18px;padding:12px 16px;font:inherit;font-weight:800;font-size:18px;color:#fff;background:var(--a);box-shadow:var(--sh);cursor:pointer}

.grid{display:grid;gap:10px;margin-bottom:12px}.home{grid-template-columns:1fr 1fr}

.hero{text-align:center}.hero h1{margin:0;font-size:clamp(30px,9vw,46px);color:var(--a)}.hero p{margin:2px 0 6px;font-size:20px;font-weight:700}
.logo{font-size:84px;animation:bn 1.6s infinite}.fl{font-size:26px;letter-spacing:10px}

.lr::after{content:"✓";position:absolute;top:1px;right:6px;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;margin-bottom:6px;font-size:clamp(20px,6vw,30px);font-weight:800;cursor:pointer}
.row small{display:block;width:100%;font-size:13px;opacity:.75;font-weight:600}.row span,.row b{font-size:inherit}
.row.hl,.n.hl{background:#ffeb3b!important;color:#222;transform:scale(1.04)}
.big{font-size:clamp(24px,7vw,38px);font-weight:800}.qq{font-size:clamp(36px,12vw,64px);font-weight:800;text-align:center;padding:26px 10px}
.opt{font-size:clamp(24px,8vw,38px);padding:18px 6px}
.bar{height:14px;border-radius:9px;background:rgba(128,128,128,.25);margin-bottom:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
input[type=number]{font:inherit;font-size:24px;padding:8px 12px;border-radius:14px;border:2px solid var(--a);width:100%;background:var(--card);color:var(--ink);margin-bottom:10px}
.stat{display:flex;flex-wrap:wrap;gap:8px}.stat>div{flex:1;min-width:90px;text-align:center;font-size:14px}.stat b{display:block;font-size:26px}.stars{font-size:52px}
.mini{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.mini i{font-style:normal;font-size:10px;text-align:center;padding:4px 0;border-radius:6px;background:rgba(128,128,128,.22)}.mini i.f{background:var(--ok);color:#fff}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.bdg div{text-align:center;font-size:13px;font-weight:700}.bdg span{display:block;font-size:38px}.bdg .off{filter:grayscale(1);opacity:.4}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#222;color:#fff;padding:12px 18px;border-radius:16px;max-width:90%;transition:transform .3s;z-index:9;text-align:center}#toast.s{transform:translate(-50%,0)}
.cf{position:fixed;top:-40px;font-size:28px;animation:fall 3.5s linear forwards;pointer-events:none;z-index:8}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bn{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>

type:['Quiz type','क्विज़ का प्रकार'],len:['Questions','प्रश्न'],go:['Let’s go!','शुरू करें!'],add:['Addition','जोड़'],sub:['Subtraction','घटाव'],mul:['Multiplication','गुणा'],div:['Division','भाग'],tbl:['Tables','पहाड़े'],miss:['Missing number','खाली जगह'],mix:['Mixed','मिश्रित'],
res:['Result','नतीजा'],well:['Well done!','शाबाश!'],ok:['Correct','सही'],wr:['Wrong','गलत'],again:['Play again','फिर खेलें'],today:['Today’s target','आज का लक्ष्य'],dq:['Daily quiz','आज की क्विज़'],streak:['Streak (days)','लगातार दिन'],free:['Practice any table','कोई भी पहाड़ा अभ्यास करें'],
done:['Tables learned','याद पहाड़े'],quizzes:['Quizzes','क्विज़'],avg:['Average','औसत'],best:['Best','सर्वश्रेष्ठ'],badges:['Badges','बैज'],reset:['Reset progress','प्रगति मिटाएँ'],sure:['Tap again to confirm','पक्का? फिर दबाएँ'],

try{Object.assign(P,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}};
const t=k=>T[k][P.lang==='hi'?1:0],tof=n=>P.lang==='hi'?n+' का पहाड़ा':'Table of '+n;
const td=()=>new Date().toLocaleDateString('en-CA'),yd=()=>new Date(Date.now()-864e5).toLocaleDateString('en-CA');
const dy=()=>{if(P.daily.d!==td())P.daily={d:td(),l:0,q:0};return P.daily},cs=()=>P.last===td()||P.last===yd()?P.streak:0,target=()=>2+Math.floor(Date.now()/864e5)%19;
const ON='एक दो तीन चार पाँच छह सात आठ नौ दस ग्यारह बारह तेरह चौदह पंद्रह सोलह सत्रह अठारह उन्नीस बीस इक्कीस बाईस तेईस चौबीस पच्चीस छब्बीस सत्ताईस अट्ठाईस उनतीस तीस इकतीस बत्तीस तैंतीस चौंतीस पैंतीस छत्तीस सैंतीस अड़तीस उनतालीस चालीस इकतालीस बयालीस तैंतालीस चौवालीस पैंतालीस छियालीस सैंतालीस अड़तालीस उनचास पचास इक्यावन बावन तिरपन चौवन पचपन छप्पन सत्तावन अट्ठावन उनसठ साठ इकसठ बासठ तिरसठ चौंसठ पैंसठ छियासठ सड़सठ अड़सठ उनहत्तर सत्तर इकहत्तर बहत्तर तिहत्तर चौहत्तर पचहत्तर छिहत्तर सतहत्तर अठहत्तर उनासी अस्सी इक्यासी बयासी तिरासी चौरासी पचासी छियासी सत्तासी अट्ठासी नवासी नब्बे इक्यानवे बानवे तिरानवे चौरानवे पचानवे छियानवे सत्तानवे अट्ठानवे निन्यानवे';
const HI=('शून्य '+ON).split(' '),HW='एकम दूनी तिया चौके पंजे छक्के सत्ते अट्ठे नवे दहाई'.split(' ');
const Hn=n=>n<100?HI[n]:n<1000?HI[n/100|0]+' सौ'+(n%100?' '+HI[n%100]:''):Hn(n/1000|0)+' हज़ार'+(n%1000?' '+Hn(n%1000):'');
const o1=' one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' '),o10='  twenty thirty forty fifty sixty seventy eighty ninety'.split(' ');
const En=n=>n===0?'zero':n<20?o1[n]:n<100?o10[n/10|0]+(n%10?'-'+o1[n%10]:''):n<1000?o1[n/100|0]+' hundred'+(n%100?' '+En(n%100):''):En(n/1000|0)+' thousand'+(n%1000?' '+En(n%1000):'');
const nm=(v,l)=>l==='hi'?Hn(v):En(v);
const tl=(n,l)=>Array.from({length:10},(_,i)=>l==='hi'?`${Hn(n)} ${HW[i]} ${Hn(n*(i+1))}`:`${En(n)} times ${En(i+1)} equals ${En(n*(i+1))}`);
const seq=()=>S.cm==='d'?Array.from({length:100},(_,i)=>100-i):Array.from({length:S.cm==='k'?1000:100},(_,i)=>i+1);
const lines=()=>S.scr==='tbl'?tl(S.tbl,S.vl):seq().map(v=>nm(v,S.vl));
let S={scr:'home',rng:10,vl:P.lang,tbl:1,from:'tables',cm:'u',qt:'mix',ql:10,qz:null,nn:25,rc:0,tm:0};
/* voice */
const SY=window.speechSynthesis;let Q={L:[],i:0,st:'stop',tok:0};
const vo=l=>(SY?SY.getVoices():[]).find(x=>x.lang.toLowerCase().startsWith(l));
if(SY)SY.onvoiceschanged=()=>{};
function ut(x,l){const u=new SpeechSynthesisUtterance(x),v=vo(l);u.lang=l==='hi'?'hi-IN':'en-US';if(v){u.voice=v;u.lang=v.lang}u.rate=P.speed;return u}
const stopQ=()=>{Q.st='stop';Q.tok++;SY&&SY.cancel();hl(-1)};
function hl(i){document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));const e=i>=0&&$('#l'+i);if(e){e.classList.add('hl');e.scrollIntoView({block:'center',behavior:'smooth'})}}
function start(L){if(!SY)return toast(t('nosp'));if(S.vl==='hi'&&!vo('hi'))toast(t('nohi'));stopQ();Q.L=L;Q.i=0;Q.st='play';setTimeout(run,80)}
function run(){const tk=++Q.tok;if(Q.i>=Q.L.length){Q.st='stop';hl(-1);if(S.scr==='tbl'){mark(S.tbl,1);render();toast('🎉')}return}
hl(Q.i);const u=ut(Q.L[Q.i],S.vl);u.onend=()=>{if(tk===Q.tok&&Q.st==='play'){Q.i++;run()}};u.onerror=()=>{if(tk===Q.tok)Q.st='stop'};SY.speak(u)}
function mark(n,on){on?P.learned[n]=1:delete P.learned[n];if(on&&n===target())dy().l=1;save()}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),3500)}
/* quiz */
function mkq(type,tbl){if(type==='mix')type=['add','sub','mul','div','tbl','miss'][R(0,5)];let q,a;
if(type==='add'){const x=R(1,50),y=R(1,50);q=`${x} + ${y}`;a=x+y}
else if(type==='sub'){const x=R(10,99),y=R(1,x);q=`${x} − ${y}`;a=x-y}
else if(type==='mul'){const x=R(2,12),y=R(2,12);q=`${x} × ${y}`;a=x*y}
else if(type==='div'){const y=R(2,12),z=R(1,12);q=`${y*z} ÷ ${y}`;a=z}
else if(type==='tbl'){const x=tbl||R(2,20),y=R(1,10);q=`${x} × ${y}`;a=x*y}
else{const x=R(2,20),y=R(2,12),m=R(0,2);if(m===0){q=`${x} + ? = ${x+y}`;a=y}else if(m===1){q=`? × ${y} = ${x*y}`;a=x}else{q=`${x+y} − ? = ${x}`;a=y}}
const o=new Set([a]);while(o.size<4){const v=a+R(1,10)*(R(0,1)?1:-1);if(v>=0)o.add(v)}
return{t:q.includes('?')?q:q+' = ?',a,o:[...o].sort(()=>Math.random()-.5)}}
function startQuiz(type,len,tbl,daily){S.qz={qs:Array.from({length:len},()=>mkq(type,tbl)),i:0,ok:0,bad:[],lk:0,daily,type,len};go('quiz')}
function answer(v){const z=S.qz;if(z.lk)return;z.lk=1;const q=z.qs[z.i],ok=v===q.a;ok?z.ok++:z.bad.push({q:q.t,a:q.a});
document.querySelectorAll('.opt').forEach(b=>{const x=+b.dataset.v;if(x===q.a)b.classList.add('good');else if(x===v)b.classList.add('bad')});
S.tm=setTimeout(()=>{z.lk=0;z.i++;z.i>=z.len?fin():render()},ok?700:1400)}
function fin(){const z=S.qz,p=Math.round(z.ok/z.len*100);P.quizzes.push({d:td(),t:z.type,n:z.len,p});P.quizzes=P.quizzes.slice(-200);
if(z.daily){const d=dy();if(!d.q){d.q=1;P.streak=P.last===yd()?P.streak+1:1;P.last=td();P.mx=Math.max(P.mx,P.streak)}}
save();z.p=p;go('res');if(p>=50)boom()}
function boom(){const e=['🎉','⭐','🎈','✨','🌟','🎊'];for(let i=0;i<32;i++){const s=document.createElement('span');s.className='cf';s.textContent=e[i%6];s.style.left=R(0,95)+'%';s.style.animationDelay=Math.random()*1.2+'s';document.body.append(s);setTimeout(()=>s.remove(),5000)}}
/* views */
const hd=(x,b)=>`<div class="top"><button class="btn" data-a="go" data-v="${b}">←</button><h2>${x}</h2></div>`;
const ctl=()=>`<div class="card"><div class="grid" style="grid-template-columns:1fr 1fr;margin:0 0 8px"><button class="btn g" data-a="play">▶ ${t('play')}</button><button class="btn o" data-a="pause">⏸ ${t('pause')}</button><button class="btn" data-a="resume">⏯ ${t('resume')}</button><button class="btn r" data-a="rep">🔁 ${t('rep')}</button></div>
<div class="chips"><button class="chip ${S.vl==='hi'?'on':''}" data-a="vl" data-v="hi">🔊 हिन्दी</button><button class="chip ${S.vl==='en'?'on':''}" data-a="vl" data-v="en">🔊 English</button></div>
<label>${t('speed')}: <b id="sp">${P.speed}×</b><input type="range" min=".4" max="1.4" step=".1" value="${P.speed}" data-a="speed" style="width:100%"></label></div>`;

const nb=v=>{v=Math.max(0,Math.min(99999,Math.floor(+v||0)));return`<div class="card c"><div class="big">${v}</div><p>${En(v)}</p><p>${Hn(v)}</p><button class="btn" data-a="say" data-v="${v}" data-l="en">🔊 English</button> <button class="btn o" data-a="say" data-v="${v}" data-l="hi">🔊 हिन्दी</button></div>`};

const BG=()=>{const q=P.quizzes,l=Object.keys(P.learned).length;return[['🌱',['First quiz','पहली क्विज़'],q.length>0],['📚',['5 tables','5 पहाड़े'],l>=5],['🎓',['25 tables','25 पहाड़े'],l>=25],['👑',['100 tables','100 पहाड़े'],l>=100],['🔥',['3-day streak','3 दिन'],P.mx>=3],['🚀',['7-day streak','7 दिन'],P.mx>=7],['💯',['Perfect score','पूरे अंक'],q.some(x=>x.p===100)]]};
const V={
home:()=>`<div class="hero"><div class="logo">🦉</div><h1>My Maths Guru</h1><p>1 – 100 ${t('tbl')}</p><div class="fl">➕ ✖️ ➗ ⭐</div><div class="chips"><button class="chip" data-a="lang" data-v="${P.lang==='hi'?'en':'hi'}">🌐 ${P.lang==='hi'?'English':'हिन्दी'}</button><span class="chip">🔥 ${cs()}</span></div></div><div class="grid home">${H.map(([k,e,c],i)=>`<button class="hc ${i?'':'w'}" style="background:${c};animation-delay:${i*.07}s" data-a="go" data-v="${k==='tables'?'tables':k}"><span>${e}</span>${t(k)}</button>`).join('')}</div>`,

tbl:()=>{const n=S.tbl,L=tl(n,S.vl),f=S.from;return hd(tof(n),f)+`<div class="grid" style="grid-template-columns:1fr 1fr">${n>1?`<button class="btn o" data-a="tb" data-f="${f}" data-v="${n-1}">← ${n-1}</button>`:'<i></i>'}${n<100?`<button class="btn o" data-a="tb" data-f="${f}" data-v="${n+1}">${n+1} →</button>`:'<i></i>'}</div>`+ctl()+`<div class="card">${L.map((x,i)=>`<div class="row" id="l${i}" style="background:hsla(${(n*37+i*30)%360},80%,60%,.25)"><span>${n} × ${i+1} = ${n*(i+1)}</span><small>${x}</small></div>`).join('')}</div><button class="btn g" style="width:100%" data-a="lrn">${P.learned[n]?'✅ ':''}${t('lrn')}</button>`},
count:()=>hd(t('count'),'home')+`<div class="chips">${[['u','1 → 100'],['d','100 → 1'],['k','1 → 1000']].map(([k,l])=>`<button class="chip ${S.cm===k?'on':''}" data-a="cm" data-v="${k}">${l}</button>`).join('')}</div><div class="card c big" id="bn">${t('pick')}</div>`+ctl()+`<div class="grid nums">${nums(seq(),seq().length,0)}</div>`,
names:()=>hd(t('names'),'home')+`<input type="number" inputmode="numeric" min="0" max="99999" value="${S.nn}" data-a="nn"><div id="nr">${nb(S.nn)}</div><div class="card">${Array.from({length:100},(_,i)=>`<div class="row" data-a="say" data-l="${P.lang}" data-v="${i+1}"><b>${i+1}</b><span>${Hn(i+1)}</span><span>${En(i+1)}</span></div>`).join('')}</div>`,
quiz:()=>{const z=S.qz;if(!z)return hd(t('quiz'),'home')+`<div class="card"><h3>${t('type')}</h3><div class="chips">${['mix','add','sub','mul','div','tbl','miss'].map(k=>`<button class="chip ${S.qt===k?'on':''}" data-a="qt" data-v="${k}">${t(k)}</button>`).join('')}</div><h3>${t('len')}</h3><div class="chips">${[10,20,50].map(n=>`<button class="chip ${S.ql===n?'on':''}" data-a="ql" data-v="${n}">${n}</button>`).join('')}</div></div><button class="btn g" style="width:100%;font-size:24px" data-a="qs">${t('go')}</button>`;
const q=z.qs[z.i];return hd(`${z.i+1} / ${z.len}`,'home')+`<div class="bar"><i style="width:${z.i/z.len*100}%"></i></div><div class="card qq">${q.t}</div><div class="grid" style="grid-template-columns:1fr 1fr">${q.o.map(o=>`<button class="btn opt" data-a="ans" data-v="${o}">${o}</button>`).join('')}</div>`},
res:()=>{const z=S.qz,s=z.p>=90?3:z.p>=70?2:z.p>=40?1:0;return hd(t('res'),'home')+`<div class="card c"><div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><h1 style="margin:4px">${z.ok} / ${z.len}</h1><p class="big">${t('well')}</p><div class="stat"><div>✅ ${t('ok')}<b>${z.ok}</b></div><div>❌ ${t('wr')}<b>${z.bad.length}</b></div><div>📊<b>${z.p}%</b></div></div></div>${z.bad.length?`<div class="card"><h3>❌ → ✔</h3>${z.bad.map(b=>`<div class="row"><span>${b.q}</span><b>✔ ${b.a}</b></div>`).join('')}</div>`:''}<button class="btn g" style="width:100%" data-a="again">${t('again')}</button>`},
prac:()=>{const d=dy(),n=target();return hd(t('prac'),'home')+`<div class="card"><h3>🎯 ${t('today')}</h3><p>${d.l?'✅':'⬜'} 📖 ${tof(n)} <button class="btn" data-a="tb" data-f="prac" data-v="${n}">▶</button></p><p>${d.q?'✅':'⬜'} 🧠 ${t('dq')} <button class="btn g" data-a="dq">▶</button></p><p>🔥 ${t('streak')}: <b>${cs()}</b></p></div><div class="card"><h3>${t('free')}</h3><input type="number" id="pt" min="1" max="100" value="${n}"><button class="btn g" data-a="pq">▶ 10 ${t('len')}</button></div>`},
prog:()=>{const q=P.quizzes,l=Object.keys(P.learned).length,avg=q.length?Math.round(q.reduce((s,x)=>s+x.p,0)/q.length):0,best=q.length?Math.max(...q.map(x=>x.p)):0;return hd(t('prog'),'home')+`<div class="card stat"><div>🔥<b>${cs()}</b>${t('streak')}</div><div>📘<b>${l}/100</b>${t('done')}</div><div>🧠<b>${q.length}</b>${t('quizzes')}</div><div>📊<b>${avg}%</b>${t('avg')}</div><div>🥇<b>${best}%</b>${t('best')}</div></div><div class="card"><h3>${t('done')}</h3><div class="mini">${Array.from({length:100},(_,i)=>`<i class="${P.learned[i+1]?'f':''}">${i+1}</i>`).join('')}</div></div><div class="card"><h3>${t('badges')}</h3><div class="bdg">${BG().map(([e,n,ok])=>`<div class="${ok?'':'off'}"><span>${e}</span>${n[P.lang==='hi'?1:0]}</div>`).join('')}</div></div>`},
lang:()=>hd(t('lang'),'home')+`<div class="grid home"><button class="hc" style="background:#42a5f5" data-a="lang" data-v="en"><span>A</span>English ${P.lang==='en'?'✓':''}</button><button class="hc" style="background:#ff7043" data-a="lang" data-v="hi"><span>अ</span>हिन्दी ${P.lang==='hi'?'✓':''}</button></div><button class="btn r" style="width:100%" data-a="reset">${S.rc?t('sure'):t('reset')}</button>`};
function render(){try{$('#app').innerHTML=V[S.scr]()}catch(e){$('#app').innerHTML='<div class="card">⚠ '+e.message+'</div>'}}
function go(s,o){stopQ();clearTimeout(S.tm);if(s!=='quiz'&&s!=='res')S.qz=null;Object.assign(S,o||{},{scr:s,rc:0});render();scrollTo(0,0)}
const A={go:v=>go(v),lang:v=>{P.lang=S.vl=v;save();render()},rng:v=>{S.rng=+v;render()},tb:(v,el)=>go('tbl',{tbl:+v,from:el.dataset.f||'tables'}),
vl:v=>{stopQ();S.vl=v;render()},play:()=>start(lines()),rep:()=>start(lines()),
pause:()=>{if(Q.st==='play'){Q.st='pause';Q.tok++;SY&&SY.cancel()}},resume:()=>{if(Q.st==='pause'){Q.st='play';run()}},
lrn:()=>{mark(S.tbl,!P.learned[S.tbl]);render()},cm:v=>{stopQ();S.cm=v;render()},
say:(v,el)=>{if(!SY)return toast(t('nosp'));v=+v;const l=el.dataset.l||S.vl,x=nm(v,l),b=$('#bn');if(b)b.textContent=v+' = '+x;if(l==='hi'&&!vo('hi'))toast(t('nohi'));stopQ();SY.speak(ut(x,l))},
qt:v=>{S.qt=v;render()},ql:v=>{S.ql=+v;render()},qs:()=>startQuiz(S.qt,S.ql),ans:v=>answer(+v),again:()=>go('quiz',{qz:null}),
dq:()=>startQuiz('tbl',10,target(),1),pq:()=>startQuiz('tbl',10,Math.max(1,Math.min(100,+$('#pt').value||2))),
reset:()=>{if(S.rc){P={lang:P.lang,speed:P.speed,learned:{},streak:0,mx:0,last:'',quizzes:[],daily:{d:'',l:0,q:0}};save();go('home')}else{S.rc=1;render()}}};
const app=$('#app');
app.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;try{A[el.dataset.a]&&A[el.dataset.a](el.dataset.v,el)}catch(x){toast('⚠ '+x.message)}});
app.addEventListener('input',e=>{const el=e.target;if(el.dataset.a==='speed'){P.speed=+el.value;save();$('#sp').textContent=P.speed+'×'}else if(el.dataset.a==='nn'){S.nn=el.value;$('#nr').innerHTML=nb(el.value)}});
window.addEventListener('error',e=>toast('⚠ '+e.message));
render();
</script></body></html>
